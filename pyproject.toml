[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llev"
version = "0.1.0"
description = "Open-source Jev alternative: a self-hosted System One decision engine that returns typed answers with probabilities from a small local LLM"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Syed Yahya" }]
keywords = [
  "jev", "jev-alternative", "typesafe", "system-one", "open-source", "self-hosted",
  "llm", "classification", "structured-output", "llama-cpp", "gguf", "confidence",
  "content-moderation", "ticket-triage", "decision-engine",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "llama-cpp-python>=0.3.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "numpy>=1.26",
  "huggingface_hub>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/thesyedyahya/llev"
Issues = "https://github.com/thesyedyahya/llev/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["llev*"]

[tool.setuptools.package-data]
llev = ["playground.html"]
